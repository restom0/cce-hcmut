sonar.host.url=https://sonarcloud.io

sonar.sources=.
sonar.sourceEncoding=UTF-8

# Third-party code we vendored rather than wrote, archived exercises/demo
# applications, generated assets and binary content. Leaving these in buries
# the maintained CI/deploy surface under old classroom examples, jQuery,
# Bootstrap, DataTables and WordPress plugin findings.
sonar.exclusions=\
  **/bower_components/**,\
  **/node_modules/**,\
  **/vendor/**,\
  **/dist/**,\
  **/*.min.js,\
  **/*.min.css,\
  **/pluto-1.0.0/**,\
  **/polylang/**,\
  **/homework/**,\
  **/Template_BootStrap/**,\
  **/GiaoDien_Front/**,\
  **/ckeditor/**,\
  **/courses/**,\
  **/exercises/**,\
  **/ban_hoa/**,\
  **/assets/dest/**,\
  **/Template/source/**,\
  **/public/backend/**,\
  **/public/admin/**,\
  **/admin/admin/**,\
  PHPNC/project/layout.php,\
  ĐA/project/exercises/buoi-06/admin/**,\
  **/assets/css/bootstrap*.css,\
  **/full-width-slider*/**,\
  PHPCB/project/css/styles.css,\
  **/*.component.css,\
  **/Views/**,\
  PHPNC/project/dangnhap.php,\
  PHPNC/project/gioithieu.php,\
  PHPNC/project/thanhtoan.php,\
  **/Dockerfile,\
  **/*.sql,\
  **/*.zip,\
  **/*.rar,\
  **/*.pdf,\
  **/*.pptx,\
  **/*.docx

# Blade templates end in .php, so the PHP analyser picks them up and fails to
# parse @extends / @section. They are templates, not PHP source.
sonar.php.exclusions=**/*.blade.php

# Classify specs as tests rather than production code, so they are not held to
# the same maintainability rules and do not skew the quality gate. Uses
# test.inclusions rather than sonar.tests: sonar.sources is the repo root, and
# naming the same path in both is an analysis error.
sonar.test.inclusions=\
  **/*.spec.ts,\
  **/*.spec.js,\
  **/tests/Feature/**,\
  **/tests/Unit/**

# Coverage should reflect code that has a maintained runner in CI. Framework
# bootstrap, config, migrations, static lessons, archived PHP exercises and
# generated assets stay in analysis, but are excluded from coverage math.
sonar.coverage.exclusions=\
  **/database/**,\
  **/config/**,\
  **/bootstrap/**,\
  **/routes/**,\
  **/resources/**,\
  **/public/index.php,\
  **/tests/**,\
  **/karma.conf.js,\
  **/src/main*.ts,\
  **/src/test.ts,\
  **/src/environments/**,\
  Lavarel/project/app/**,\
  ÄA/project/app/**,\
  JS/project/myproject1/server.ts,\
  JS/project/myproject1/src/app/app.config*.ts,\
  Bootstrap/**,\
  HTML+CSS/**,\
  PHPCB/**,\
  PHPNC/**,\
  tools/**

# Coverage is generated in .github/workflows/sonar.yml before the scanner runs.
sonar.javascript.lcov.reportPaths=\
  JS/project/projectAngular/coverage/project-angular/lcov.info,\
  JS/project/projectAngular/coverage/lcov.info,\
  JS/project/myproject1/coverage/myproject1/lcov.info,\
  JS/project/myproject1/coverage/lcov.info
sonar.php.coverage.reportPaths=\
  Lavarel/project/coverage.xml,\
  ĐA/project/coverage.xml

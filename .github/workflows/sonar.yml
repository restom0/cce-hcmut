name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonar:
    name: Quality scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Shallow clones stop Sonar attributing issues to the right commit.
          fetch-depth: 0

      - name: Check Sonar token
        id: creds
        env:
          TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN is not set; skipping the scan. Create the project on sonarcloud.io and add the token as a repository secret."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # --- Coverage -----------------------------------------------------------
      # Sonar only shows coverage if the lcov/clover reports named in
      # sonar-project.properties already exist when the scanner runs, so the
      # suites run here in the same job right before the scan. Each step is
      # continue-on-error and guards every app with `|| echo`: a suite that has
      # not been touched since the Angular 14->22 upgrade must neither fail the
      # scan nor stop the other apps from reporting, and whatever coverage was
      # produced is still picked up. Skipped when SONAR_TOKEN is absent, since
      # there would be no scan to feed.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            JS/project/projectAngular/package-lock.json
            JS/project/myproject1/package-lock.json

      - name: Generate Angular coverage
        if: steps.creds.outputs.configured == 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          for app in JS/project/projectAngular JS/project/myproject1; do
            echo "::group::$app"
            ( npm --prefix "$app" ci --ignore-scripts && npm --prefix "$app" run test:ci ) \
              || echo "::warning::Angular tests failed for $app; its coverage will be missing"
            echo "lcov: $(ls -l "$app/coverage/lcov.info" 2>/dev/null || echo MISSING)"
            echo "::endgroup::"
          done

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: steps.creds.outputs.configured == 'true'
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: pcov

      # The Unit suite is plain PHPUnit (no booted app, no database), so it needs
      # neither a .env nor an APP_KEY; --no-scripts skips the package discovery
      # the Unit tests do not use.
      - name: Generate Laravel coverage
        if: steps.creds.outputs.configured == 'true'
        continue-on-error: true
        run: |
          for app in "Lavarel/project" "ĐA/project"; do
            echo "::group::$app"
            ( composer --working-dir="$app" install --no-interaction --no-progress --no-scripts \
              && ( cd "$app" && vendor/bin/phpunit --testsuite=Unit --coverage-clover=coverage.xml ) ) \
              || echo "::warning::Laravel tests failed for $app; its coverage will be missing"
            echo "clover: $(ls -l "$app/coverage.xml" 2>/dev/null || echo MISSING)"
            echo "::endgroup::"
          done
      # ------------------------------------------------------------------------

      # v5 is affected by an argument-injection advisory (Dependabot #385).
      #
      # qualitygate.wait makes the scanner block until SonarCloud has finished
      # computing the gate and exit non-zero if it fails, so a regression shows
      # up here and not only on the dashboard. Done with the scanner's own flag
      # rather than a second action: sonarqube-quality-gate-action was last
      # released in 2025 and this repo has already been bitten once by an
      # outdated Sonar action.
      #
      # continue-on-error keeps the gate *advisory* for now: the analysis
      # uploads fine every run, but the gate-status read comes back "Not
      # authorized or project not found" because the SonarCloud project's main
      # branch is still `main` (this repo moved to `master`, so `master` is
      # analysed as a short-lived branch whose new-code ref does not exist) and
      # possibly because SONAR_TOKEN is a project-analysis token that cannot
      # read the gate. Both are fixed on sonarcloud.io, not here: rename the
      # project's main branch to `master` (Administration -> Branches and Pull
      # Requests), and if it still fails, replace SONAR_TOKEN with a User Token
      # (My Account -> Security). The gate result is still printed in this
      # step's log; once it passes cleanly, drop the two continue-on-error
      # lines below to make a gate failure fail the job again.
      - name: SonarCloud scan and quality gate
        if: steps.creds.outputs.configured == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.branch.name=master
            -Dsonar.qualitygate.wait=true

      - name: SonarCloud pull request scan and quality gate
        if: steps.creds.outputs.configured == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

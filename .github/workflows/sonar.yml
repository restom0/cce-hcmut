name: SonarCloud

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  sonar:
    name: Quality scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # Shallow clones stop Sonar attributing issues to the right commit.
          fetch-depth: 0

      - name: Check Sonar token
        id: creds
        env:
          TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SONAR_TOKEN is not set; skipping the scan. Create the project on sonarcloud.io and add the token as a repository secret."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # --- Coverage -----------------------------------------------------------
      # Sonar only shows coverage if the lcov/clover reports named in
      # sonar-project.properties already exist when the scanner runs, so the
      # suites run here in the same job right before the scan. Each step is
      # continue-on-error and guards every app with `|| echo`: a suite that has
      # not been touched since the Angular 14->22 upgrade must neither fail the
      # scan nor stop the other apps from reporting, and whatever coverage was
      # produced is still picked up. Skipped when SONAR_TOKEN is absent, since
      # there would be no scan to feed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.creds.outputs.configured == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            JS/project/projectAngular/package-lock.json
            JS/project/myproject1/package-lock.json

      - name: Generate Angular coverage
        if: steps.creds.outputs.configured == 'true'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          for app in JS/project/projectAngular JS/project/myproject1; do
            echo "::group::$app"
            ( npm --prefix "$app" ci --ignore-scripts && npm --prefix "$app" run test:ci ) \
              || echo "::warning::Angular tests failed for $app; its coverage will be missing"
            echo "lcov: $(ls -l "$app/coverage/lcov.info" 2>/dev/null || echo MISSING)"
            echo "::endgroup::"
          done

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        if: steps.creds.outputs.configured == 'true'
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: pcov

      # The Unit suite is plain PHPUnit (no booted app, no database), so it needs
      # neither a .env nor an APP_KEY; --no-scripts skips the package discovery
      # the Unit tests do not use.
      - name: Generate Laravel coverage
        if: steps.creds.outputs.configured == 'true'
        continue-on-error: true
        run: |
          for app in "Lavarel/project" "ĐA/project"; do
            echo "::group::$app"
            ( composer --working-dir="$app" install --no-interaction --no-progress --no-scripts \
              && ( cd "$app" && vendor/bin/phpunit --testsuite=Unit --coverage-clover=coverage.xml ) ) \
              || echo "::warning::Laravel tests failed for $app; its coverage will be missing"
            echo "clover: $(ls -l "$app/coverage.xml" 2>/dev/null || echo MISSING)"
            echo "::endgroup::"
          done
      # ------------------------------------------------------------------------

      # v5 is affected by an argument-injection advisory (Dependabot #385).
      #
      # branch.name=main, not master: CI runs on the master branch, but the
      # SonarCloud project's main branch is named `main`. Uploading the analysis
      # as `main` lands it on the project's main branch (the Overview), so
      # coverage and findings actually show and the gate is computed against the
      # main line. Labelling it `master` instead files it as a separate
      # short-lived branch, which is why the Overview froze at its last `main`
      # scan. The repo-side alternative to renaming the main branch to `master`
      # in the SonarCloud UI.
      #
      # qualitygate.wait makes the scanner block until SonarCloud has computed
      # the gate and exit non-zero if it fails, turning a regression red here
      # rather than only on the dashboard. Kept *advisory* with continue-on-error
      # until a clean run confirms the gate now reads successfully (analysing the
      # real main branch should clear the earlier "Not authorized or project not
      # found"); if it still fails, SONAR_TOKEN is a project-analysis token and
      # needs to be a User Token with Browse permission (My Account -> Security).
      # Once it passes, drop the two continue-on-error lines to make a gate
      # failure fail the job again.
      - name: SonarCloud scan and quality gate
        if: steps.creds.outputs.configured == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.branch.name=main
            -Dsonar.qualitygate.wait=true

      - name: SonarCloud pull request scan and quality gate
        if: steps.creds.outputs.configured == 'true' && github.event_name == 'pull_request'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
